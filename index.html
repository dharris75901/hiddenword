<body>
<style>
/* Layout: one phone column, four tabs pinned to the bottom, quiz and editor open as sheets */
:root{
  --bg:#F1F4F1; --surface:#FFFFFF; --ink:#1B2621; --muted:#5B6962; --line:#D7DED9;
  --accent:#2E6A55; --accent-ink:#FFFFFF; --accent-soft:#E0ECE6;
  --brass:#9A6E14; --brass-soft:#F4E9D1;
  --ok:#2B7A4B; --ok-soft:#DCEFE2; --bad:#B03F2D; --bad-soft:#F7E0DA;
  --scrim:rgba(20,30,25,.45);
  --scripture:"Crimson Pro", Georgia, "Times New Roman", serif;
  --ui:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#111714; --surface:#1A221E; --ink:#E5ECE7; --muted:#9AA9A1; --line:#2C3832;
  --accent:#72B798; --accent-ink:#0E1914; --accent-soft:#1E3229;
  --brass:#DDAE52; --brass-soft:#332A19;
  --ok:#6CC28D; --ok-soft:#1B3325; --bad:#E78B76; --bad-soft:#3B231D;
  --scrim:rgba(0,0,0,.6); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#111714; --surface:#1A221E; --ink:#E5ECE7; --muted:#9AA9A1; --line:#2C3832;
  --accent:#72B798; --accent-ink:#0E1914; --accent-soft:#1E3229;
  --brass:#DDAE52; --brass-soft:#332A19;
  --ok:#6CC28D; --ok-soft:#1B3325; --bad:#E78B76; --bad-soft:#3B231D;
  --scrim:rgba(0,0,0,.6); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 120px}
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{font-family:var(--scripture);font-size:1.9rem;font-weight:600;letter-spacing:-.01em;line-height:1}
.brand small{display:block;font-family:var(--ui);font-size:.72rem;font-weight:500;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:6px}
.streak{display:flex;flex-direction:column;align-items:center;background:var(--brass-soft);color:var(--brass);border-radius:12px;padding:6px 12px;min-width:68px}
.streak b{font-size:1.35rem;line-height:1.1;font-variant-numeric:tabular-nums}
.streak span{font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em}
h2{font-size:1.3rem;margin:0;text-wrap:balance}
h3{font-size:1.05rem;margin:0}
.eyebrow{font-size:.74rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--accent)}
.muted{color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.feature{border-color:var(--accent);box-shadow:0 1px 0 var(--accent)}
.verse{font-family:var(--scripture);font-size:1.32rem;line-height:1.55;margin:0;overflow-wrap:break-word}
.clamp{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ref{font-weight:700}
.tag{font-size:.72rem;font-weight:700;letter-spacing:.05em;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--muted)}
.vhead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.dots{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted)}
.dots i{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--accent);display:inline-block}
.dots i.on{background:var(--accent)}
.dots.done{color:var(--ok)}
.btn{min-height:46px;padding:0 18px;border-radius:12px;font-weight:600;border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--accent);padding:0 8px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{min-height:38px;padding:0 12px;font-size:.92rem}
.btn:disabled{opacity:.45;cursor:default}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{min-height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.92rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hint{font-size:.92rem;color:var(--muted);margin:0}
.bar{height:8px;border-radius:4px;background:var(--accent-soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:4px}
.roll{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.roll li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);min-height:52px}
.roll .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:.8rem;font-weight:700;flex:none;border:1.5px solid var(--line);color:var(--muted);font-variant-numeric:tabular-nums}
.roll .n.open{border-color:var(--accent);color:var(--accent)}
.roll .n.done{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.roll .what{flex:1;min-width:0}
.roll .what b{display:block}
.roll .what span{font-size:.85rem;color:var(--muted)}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:10px}
.lib-item{display:flex;gap:12px;align-items:flex-start}
.lib-item .body{flex:1;min-width:0}
.lib-item .verse{font-size:1.15rem}
.empty{text-align:center;padding:28px 16px}
.menu{padding:4px 0;gap:0}
.menu-item{display:flex;align-items:center;gap:14px;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 16px;text-align:left;min-height:64px}
.menu-item:last-child{border-bottom:0}
.menu-item svg{width:24px;height:24px;flex:none;fill:none;stroke:var(--accent);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.mi-text{flex:1;min-width:0;display:flex;flex-direction:column}
.mi-text span{font-size:.88rem;color:var(--muted)}
.chev{font-size:1.6rem;color:var(--muted);line-height:1}
.back{margin-left:-8px;margin-bottom:4px}
.sd-stage{min-height:300px;display:flex;flex-direction:column;justify-content:center;align-items:stretch}
.sd-count{font-family:var(--scripture);font-weight:600;color:var(--accent);font-size:clamp(7rem,40vw,12rem);line-height:1;text-align:center;font-variant-numeric:tabular-nums}
.sd-wait{text-align:center;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.sd-page{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 18px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.sd-go{font-size:1.6rem;letter-spacing:.08em;text-transform:uppercase}
.rem-grid{display:grid;grid-template-columns:minmax(0,9.5rem) minmax(0,1fr);gap:12px}
.rem-grid input,.rem-grid select{height:50px;min-height:0;padding-block:0}
.f input[type="time"]{-webkit-appearance:none;appearance:none;min-width:0;width:100%;display:block;text-align:left;min-height:48px}
.f input[type="time"]::-webkit-date-and-time-value{text-align:left}
.nw{white-space:nowrap}
.donate-text{font-family:var(--scripture);font-size:1.25rem;line-height:1.5;margin:0}
.refs{margin-top:4px}
.two-seg{grid-template-columns:1fr 1fr}
.drillbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 16px;display:flex;flex-direction:column;gap:12px;text-align:center;min-height:200px;justify-content:center}
.drillref{font-family:var(--scripture);font-size:2.2rem;font-weight:600;line-height:1.15;text-wrap:balance}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--brass);font-size:1.1rem}
.answer{border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.btn.go{min-height:60px;font-size:1.2rem;width:100%}
.btn.ok-btn{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.roll .what span.dsum{display:block;color:var(--ink);font-size:.92rem;margin:2px 0}
.refs summary{color:var(--accent);font-weight:600;font-size:.88rem;cursor:pointer;min-height:32px;display:flex;align-items:center}
.refs p{font-size:.88rem;color:var(--muted);margin:4px 0 10px;overflow-wrap:break-word}
.roll li:has(details){align-items:flex-start}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px 10px;font-size:.72rem;font-weight:600;color:var(--muted)}
nav.tabs button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--accent)}

.sheet{position:fixed;inset:0;z-index:40;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--bg);width:100%;max-width:680px;max-height:94%;overflow:auto;border-radius:18px 18px 0 0;padding-top:18px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.panel.full{height:94%}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.92rem;min-width:0}
.f input,.f select,.f textarea{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px;font-weight:400;font-size:1.05rem;width:100%}
.f textarea{font-family:var(--scripture);font-size:1.2rem;line-height:1.45;resize:vertical}
.two{display:grid;grid-template-columns:1.6fr 1fr;gap:12px}
.note{font-size:.9rem;border-radius:10px;padding:8px 12px;background:var(--ok-soft);color:var(--ok)}
.err{font-size:.9rem;color:var(--bad)}
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:9px;min-height:40px;font-weight:600;font-size:.9rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.qverse{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 16px;line-height:2.15}
.blank{display:inline-flex;flex-direction:column;align-items:center;vertical-align:baseline;line-height:1.3}
.blank input{font-family:var(--scripture);font-size:1.25rem;border:0;border-bottom:2px solid var(--accent);background:var(--accent-soft);border-radius:5px 5px 0 0;padding:0 4px;text-align:center;max-width:100%}
.blank.ok input{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.blank.bad input{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);text-decoration:line-through}
.fix{font-family:var(--ui);font-size:.8rem;font-weight:700;color:var(--ok)}
.fix:empty{display:none}
.result{border-radius:12px;padding:12px 14px;font-weight:600}
.result.good{background:var(--ok-soft);color:var(--ok)}
.result.try{background:var(--brass-soft);color:var(--brass)}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.bank button{font-family:var(--scripture);font-size:1.1rem;min-height:40px;padding:0 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface)}
.bank button:disabled{opacity:.3}
.peek{font-family:var(--scripture);font-size:1.15rem;background:var(--brass-soft);border-radius:12px;padding:12px 14px;margin:0}
.recite{font-family:var(--scripture);font-size:1.25rem;line-height:1.5;border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--surface);width:100%;min-height:9em;resize:vertical}
.diff span.miss{color:var(--bad);text-decoration:underline;text-decoration-thickness:2px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}
@media (max-width:420px){.two{grid-template-columns:1fr}.seg button{font-size:.82rem}}
@media (prefers-reduced-motion:no-preference){.panel{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>

const docRefs=d=>`<details class="refs"><summary>Supporting verses (${d.refs.split(';').length})</summary><p>${esc(d.refs)}</p><a class="btn small" href="https://www.biblegateway.com/passage/?search=${encodeURIComponent(d.refs.replace(/ff\./g,''))}&version=${encodeURIComponent((S.version&&S.version!=='Other')?S.version:'KJV')}" target="_blank" rel="noopener">Read them in BibleGateway</a></details>`;
const amzUrl=s=>'https://music.amazon.com/search/'+encodeURIComponent(s.title+' '+s.artist);
const listenBtn=(ref,cls)=>{const s=songFor(ref);return s?`<a class="btn ${cls||''}" href="${amzUrl(s)}" target="_blank" rel="noopener">♪ Listen</a>`:''};

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10);
const refKey=r=>String(r).toLowerCase().replace(/[\s.]/g,'').replace(/[–—]/g,'-');
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dayNum(s){const [y,m,d]=s.split('-').map(Number);return Math.round(Date.UTC(y,m-1,d)/864e5)}
function dstr(n){return new Date(n*864e5).toISOString().slice(0,10)}
function niceDate(n){const [y,m,d]=dstr(n).split('-').map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,{month:'short',day:'numeric'})}
const builtin=ref=>BUILTIN.find(b=>refKey(b.ref)===refKey(ref));

let S=load();
function load(){
  let d=null;
  try{d=JSON.parse(localStorage.getItem(KEY))}catch(e){}
  if(!d||!Array.isArray(d.verses)){
    d={version:'KJV',verses:[],challenges:{},days:[],tab:'today'};
    ['Psalm 119:11','Proverbs 3:5-6'].forEach(r=>{const b=builtin(r);d.verses.push(mkVerse(b.ref,b.text,'KJV','builtin'))});
  }
  d.challenges=d.challenges||{};d.days=d.days||[];
  return d;
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function mkVerse(ref,text,version,src){return {id:uid(),ref,text,version,src,mastery:0,best:{},added:today()}}
const findVerse=ref=>S.verses.find(v=>refKey(v.ref)===refKey(ref));
function ensureVerse(ref){let v=findVerse(ref);if(!v){const b=builtin(ref);v=mkVerse(b.ref,b.text,b.version||'KJV','builtin');S.verses.push(v);save()}return v}

function streak(){const set=new Set(S.days);let d=dayNum(today());if(!set.has(dstr(d)))d--;let n=0;while(set.has(dstr(d))){n++;d--}return n}
function markDay(){const t=today();if(!S.days.includes(t)){S.days.push(t);S.days=S.days.slice(-400)}}

function chInfo(c){
  const st=S.challenges[c.id];if(!st)return null;
  const el=dayNum(today())-dayNum(st.start),n=c.refs.length;
  const unlocked=Math.max(1,Math.min(n,Math.floor(el*n/c.days)+1));
  const verses=c.refs.map(findVerse);
  const done=verses.map(v=>!!(v&&v.mastery>=3));
  const mastered=done.filter(Boolean).length;
  let cur=unlocked-1;for(let i=0;i<unlocked;i++){if(!done[i]){cur=i;break}}
  const opens=i=>dayNum(st.start)+Math.ceil(i*c.days/n);
  return {el,n,unlocked,verses,done,mastered,cur,opens,complete:mastered===n};
}

/* ---------- views ---------- */
function dots(v){const m=v.mastery||0;return `<span class="dots ${m>=3?'done':''}">${[1,2,3].map(i=>`<i class="${m>=i?'on':''}"></i>`).join('')}${MASTERY[m]}</span>`}
function verseCard(v){
  return `<article class="card">
    <div class="vhead"><span class="ref">${esc(v.ref)}</span><span class="tag">${esc(v.version)}</span>${dots(v)}</div>
    <p class="verse clamp">${esc(v.text)}</p>
    <div class="row"><button class="btn primary small" data-act="practice" data-id="${v.id}">Practice</button><button class="btn small" data-act="edit" data-id="${v.id}">Edit</button></div>
  </article>`;
}

function viewToday(){
  const date=new Date().toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'});
  const active=CHALLENGES.filter(c=>S.challenges[c.id]);
  const memN=S.verses.filter(v=>v.mastery>=3).length;
  let h=`<div class="stack"><div><div class="eyebrow">${esc(date)}</div><h2>Today’s verses</h2></div>
  <article class="card"><div class="row between"><div><h3>Memory Drill</h3><p class="hint">${memN?`Random draws from your ${memN} memorized verse${memN===1?'':'s'}.`:'Memorize a verse to unlock the drill.'}</p></div><button class="btn primary" data-act="drill-open">Start drill</button></div></article>`;
  const shown=new Set();
  active.forEach(c=>{
    const I=chInfo(c);const ref=c.refs[I.cur];const v=I.verses[I.cur]||{...builtin(ref),version:builtin(ref).version||'KJV',mastery:0};
    if(v.id)shown.add(v.id);
    const next=I.unlocked<I.n?`${c.unit||'Verse'} ${I.unlocked+1} opens ${niceDate(I.opens(I.unlocked))}.`:'All verses are open.';
    h+=`<article class="card feature">
      <div class="row between"><span class="eyebrow">${esc(c.name)}</span><span class="muted" style="font-size:.85rem">${I.mastered} of ${I.n} memorized</span></div>
      <div class="bar"><i style="width:${Math.round(I.mastered*100/I.n)}%"></i></div>
      ${I.complete?`<h3>Challenge complete. Well done, good and faithful servant.</h3><p class="hint">Keep reviewing to hold these verses fast.</p>`:`
      <div class="vhead"><span class="ref">${esc(ref)}</span><span class="tag">${esc(v.version)}</span>${dots(v)}</div>
      <p class="verse">${esc(v.text)}</p>`}
      ${c.music&&!I.complete&&songFor(ref)?`<p class="hint">Song: ${esc(songFor(ref).title)} · ${esc(songFor(ref).artist)}${songFor(ref).tr?' · sung in '+esc(songFor(ref).tr):''}${songFor(ref).note?' '+esc(songFor(ref).note):''}</p>`:''}
      ${c.doctrines&&!I.complete?`<p class="hint"><b>${DOCTRINES[I.cur].art}. ${esc(DOCTRINES[I.cur].title)}.</b> ${esc(DOCTRINES[I.cur].sum)}</p>${docRefs(DOCTRINES[I.cur])}`:''}
      <div class="row"><button class="btn primary" data-act="practice-ref" data-id="${esc(ref)}">${I.complete?'Review':'Practice'}</button>${c.music&&!I.complete?listenBtn(ref):''}<span class="hint">${next}</span></div>
    </article>`;
  });
  if(!active.length){
    h+=`<article class="card feature"><h3>Start a memory challenge</h3><p class="hint">Try the 12 Month Warrior, 1 Month Peace, 7 Day Romans Road, A to Z Alphabet, Jesus’ Words, Doctrine, Books of the Bible or Scripture Songs. Each one opens new verses on a schedule and quizzes you as you go.</p><div class="row"><button class="btn primary" data-act="tab" data-id="challenges">See challenges</button></div></article>`;
  }
  const review=S.verses.filter(v=>v.mastery<3&&!shown.has(v.id)).slice(0,4);
  if(review.length){h+=`<div class="section-h"><h3>Keep working on</h3><button class="btn ghost small" data-act="tab" data-id="list">All my verses</button></div>`+review.map(verseCard).join('')}
  const mem=S.verses.filter(v=>v.mastery>=3).length;
  h+=`<p class="hint" style="text-align:center">${mem} verse${mem===1?'':'s'} memorized · ${S.verses.length} in your list</p></div>`;
  return h;
}

let filter='all';
function viewList(){
  const list=S.verses.filter(v=>filter==='all'||(filter==='done'?v.mastery>=3:v.mastery<3));
  return `<div class="stack">
    <div class="row between"><h2>My verses</h2><button class="btn primary" data-act="edit">+ Add verse</button></div>
    <p class="hint">Copy a verse from your Bible app or BibleGateway.com in any version, then tap Add verse and paste it in.</p>
    <div class="chips">${[['all','All'],['learning','Learning'],['done','Memorized']].map(([k,l])=>`<button class="chip" data-act="filter" data-id="${k}" aria-pressed="${filter===k}">${l}</button>`).join('')}</div>
    ${list.length?list.map(verseCard).join(''):`<div class="card empty"><h3>${filter==='done'?'No memorized verses yet':'Your list is empty'}</h3><p class="hint">${filter==='done'?'Score 100% on Hard, or 95% on Recite, to mark a verse memorized.':'Add a verse you love, or pick one from the Library.'}</p></div>`}
  </div>`;
}

function viewLibrary(){
  const topics=[...new Set(BUILTIN.map(b=>b.topic))];
  return `<div class="stack"><div><h2>Verse library</h2><p class="hint">Built-in verses are in the King James Version. After adding one, tap Edit to paste in your own translation.</p></div>
  ${topics.map(t=>`<div class="section-h"><h3>${esc(t)}</h3></div><div class="card">${BUILTIN.filter(b=>b.topic===t).map(b=>{const have=findVerse(b.ref);return `<div class="lib-item"><div class="body"><span class="ref">${esc(b.ref)}</span><p class="verse clamp">${esc(b.text)}</p></div>${have?`<span class="tag" style="margin-top:4px">In list</span>`:`<button class="btn small" data-act="lib-add" data-id="${esc(b.ref)}">Add</button>`}</div>`}).join('<hr style="border:0;border-top:1px solid var(--line);margin:0;width:100%">')}</div>`).join('')}
  </div>`;
}

let stopConfirm=null;
function viewChallenges(){
  return `<div class="stack"><div><h2>Challenges</h2><p class="hint">Start a challenge and its verses go into your list. A verse counts as memorized when you score 100% on Hard or 95% on Recite.</p></div>
  ${CHALLENGES.map(c=>{const I=chInfo(c);
    if(!I)return `<article class="card"><div class="row between"><h3>${esc(c.name)}</h3><span class="tag">${c.refs.length} ${c.doctrines?'doctrines':'verses'}</span></div><p class="hint">${esc(c.blurb)}</p>${c.doctrines?`<details class="refs"><summary>See all 20 doctrines</summary><ol class="roll">${DOCTRINES.map((d,i)=>`<li><span class="n">${i+1}</span><div class="what"><b>${d.art}. ${esc(d.title)}</b><span class="dsum">${esc(d.sum)}</span><span>Memory verse: ${esc(d.key)}</span></div></li>`).join('')}</ol></details>`:''}<div class="row"><button class="btn primary" data-act="ch-start" data-id="${c.id}">Start challenge</button></div></article>`;
    return `<article class="card feature"><div class="row between"><h3>${esc(c.name)}</h3><span class="muted" style="font-size:.85rem">Day ${Math.min(I.el+1,c.days)} of ${c.days}</span></div>
      <div class="bar"><i style="width:${Math.round(I.mastered*100/I.n)}%"></i></div>
      <p class="hint">${I.mastered} of ${I.n} memorized</p>
      ${c.music?`<div class="row"><a class="btn small" href="${esc(S.playlist||DEFAULT_PL)}" target="_blank" rel="noopener">♪ Open the playlist</a></div>`:''}
      <ol class="roll">${c.refs.map((r,i)=>{const open=i<I.unlocked;const st=I.done[i]?'done':open?'open':'';
        return `<li><span class="n ${st}">${I.done[i]?'✓':c.letters?String.fromCharCode(65+i):i+1}</span><div class="what">${c.doctrines?`<b>${DOCTRINES[i].art}. ${esc(DOCTRINES[i].title)}</b><span class="dsum">${esc(DOCTRINES[i].sum)}</span><span>Memory verse: ${esc(r)}</span>`:`<b>${esc(r)}</b>`}${c.music&&songFor(r)?`<span>${esc(songFor(r).title)}</span>`:''}<span>${I.done[i]?'Memorized':open?MASTERY[(I.verses[i]||{}).mastery||0]:'Opens '+niceDate(I.opens(i))}</span>${c.doctrines?docRefs(DOCTRINES[i]):''}</div>${open&&c.music?listenBtn(r,'small ghost'):''}${open?`<button class="btn small" data-act="practice-ref" data-id="${esc(r)}">Practice</button>`:''}</li>`}).join('')}</ol>
      <div class="row">${stopConfirm===c.id?`<div class="stack" style="gap:8px;width:100%"><b>Stop this challenge?</b><div class="row"><button class="btn danger small" data-act="ch-stop" data-id="${c.id}">Stop, keep verses</button><button class="btn danger small" data-act="ch-stop-clear" data-id="${c.id}">Stop, remove verses</button><button class="btn ghost small" data-act="ch-stop-cancel">Keep going</button></div><p class="hint">Remove verses clears this challenge’s verses from My Verses. Verses you’ve memorized, and verses another active challenge uses, stay.</p></div>`:`<button class="btn ghost small" data-act="ch-stop-ask" data-id="${c.id}">Stop challenge</button>`}</div>
    </article>`}).join('')}
  </div>`;
}

  const item=(id,title,sub,icon)=>`<button class="menu-item" data-act="tab" data-id="${id}"><svg viewBox="0 0 24 24">${icon}</svg><span class="mi-text"><b>${title}</b><span>${sub}</span></span><span class="chev">›</span></button>`;
  return `<div class="stack"><h2>More</h2><div class="card menu">

function parsePasted(raw){
  let t=String(raw).replace(/https?:\/\/\S+/g,' ').replace(/\[[a-z]{1,2}\]/g,'').replace(/\([A-Z]{1,2}\)/g,'');
  let version=null,ref=null;
  const vm=t.match(/[(\[]?\b(NKJV|KJV|ESV|NIV|NLT|NASB1995|NASB|CSB|HCSB|AMP|NRSV|RSV|BSB|WEB|ASV|LSB|MSG|NET|CEV|GNT)\b[)\]]?/);
  if(vm){version=vm[1].startsWith('NASB')?'NASB':vm[1];t=t.replace(vm[0],' ')}
  const rm=t.match(/(?:^|\s|[—–-])((?:[1-3]\s?)?[A-Z][a-z]+\.?(?:\s(?:of\s)?[A-Z][a-z]+)?\s\d{1,3}:\d{1,3}(?:\s?[-–]\s?\d{1,3})?)/);
  if(rm){const pos=t.indexOf(rm[1]),tail=t.slice(pos+rm[1].length).trim();if(pos<6||tail.length<12){ref=rm[1].replace(/\s?[–]\s?/,'-');t=t.slice(0,pos)+' '+t.slice(pos+rm[1].length)}}

  return {ref,version,text:t};
}

let Q=null;
function tokenize(text){
  return text.split(/(\s+)/).filter(t=>t!=='').map(t=>{
    if(/^\s+$/.test(t))return {t:' '};
    const m=t.match(/^([^A-Za-z0-9]*)([A-Za-z0-9][A-Za-z0-9'’\-]*[A-Za-z0-9]|[A-Za-z0-9])([^A-Za-z0-9]*)$/);
    return m?{pre:m[1],w:m[2],post:m[3]}:{t};
  });
}
const norm=s=>String(s).toLowerCase().replace(/[‘’]/g,"'").replace(/[^a-z0-9]/g,'');
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function openQuiz(id,level){
  const v=S.verses.find(x=>x.id===id);if(!v)return;
  Q={id,level:level||['easy','medium','hard','recite'][Math.min(v.mastery||0,3)],bank:true,peek:false};
  newRound();
}
function newRound(){
  const v=S.verses.find(x=>x.id===Q.id);
  Q.tokens=tokenize(v.text);Q.checked=false;Q.peek=false;Q.active=null;
  if(Q.level!=='recite'){
    const idx=Q.tokens.map((t,i)=>t.w?i:-1).filter(i=>i>=0);
    const pref=Q.level==='hard'?idx:idx.filter(i=>Q.tokens[i].w.length>=3);
    const pool=pref.length?pref:idx;
    const n=Math.max(1,Math.round(idx.length*LEVELS[Q.level].ratio));
    let pick=shuffle(pool).slice(0,n);
    if(pick.length<n)pick=pick.concat(shuffle(idx.filter(i=>!pick.includes(i))).slice(0,n-pick.length));
    Q.blanks=new Set(pick);
    Q.bankWords=shuffle([...Q.blanks].map(i=>Q.tokens[i].w));
  }
  renderQuiz();
}
function renderQuiz(){
  const v=S.verses.find(x=>x.id===Q.id);const rec=Q.level==='recite';
  let body;
  if(rec){body=`<label class="f" for="reciteBox">Type the whole verse from memory<textarea class="recite" id="reciteBox" autocapitalize="sentences" spellcheck="false"></textarea></label><div id="diff"></div>`}
  else{body=`<div class="qverse verse">${Q.tokens.map((t,i)=>{
      if(!t.w)return esc(t.t);
      if(!Q.blanks.has(i))return esc(t.pre+t.w+t.post);
      return `<span class="nw">`+esc(t.pre)+`<span class="blank"><input id="b${i}" data-i="${i}" aria-label="Missing word" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" style="width:${Math.max(3,t.w.length+1.5)}ch"><span class="fix"></span></span>`+esc(t.post)+`</span>`;
    }).join('')}</div>
    ${Q.bank?`<div><div class="eyebrow" style="margin-bottom:8px">Word bank · tap to fill</div><div class="bank">${Q.bankWords.map((w,k)=>`<button data-act="bank" data-id="${k}">${esc(w)}</button>`).join('')}</div></div>`:''}`}
  openSheet(`<div class="row between"><div><div class="eyebrow">Memorize</div><div class="vhead"><h2>${esc(v.ref)}</h2><span class="tag">${esc(v.version)}</span></div></div><button class="btn ghost" data-act="close">Done</button></div>
    <div class="seg" role="group" aria-label="Difficulty">${Object.entries(LEVELS).map(([k,l])=>`<button data-act="level" data-id="${k}" aria-pressed="${Q.level===k}">${l.label}</button>`).join('')}</div>
    <p class="hint">${rec?'Write it out word for word. Punctuation and capitals don’t count.':LEVELS[Q.level].label+': about '+Math.round(LEVELS[Q.level].ratio*100)+'% of the words are blank. Score 100% to move up.'}</p>
    ${body}
    <div id="qResult"></div>
    ${Q.peek?`<p class="peek">${esc(v.text)}</p>`:''}
    <div class="row"><button class="btn primary" data-act="check">Check</button><button class="btn" data-act="reshuffle">${rec?'Clear':'New blanks'}</button>${rec?'':`<button class="btn ghost" data-act="toggle-bank">${Q.bank?'Hide':'Show'} word bank</button>`}<button class="btn ghost" data-act="peek">${Q.peek?'Hide verse':'Peek at verse'}</button></div>
    <p class="hint">Progress: ${dots(v)}</p>`,true);
  const first=document.querySelector('.blank input');
  document.querySelectorAll('.blank input').forEach(inp=>{
    inp.addEventListener('focus',()=>Q.active=inp);
    inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const all=[...document.querySelectorAll('.blank input')];const nx=all[all.indexOf(inp)+1];nx?nx.focus():check()}});
  });
  if(first&&!matchMedia('(pointer:coarse)').matches)first.focus();
}
function fillFromBank(k,btn){
  const all=[...document.querySelectorAll('.blank input')];
  let target=Q.active&&!Q.active.value?Q.active:all.find(i=>!i.value);
  if(!target)return;
  target.value=Q.bankWords[k];btn.disabled=true;
  const nx=all.find(i=>!i.value);if(nx){Q.active=nx;nx.focus({preventScroll:true})}
}
function lcsMask(a,b){
  const n=a.length,m=b.length,dp=Array.from({length:n+1},()=>new Uint16Array(m+1));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=a[i]===b[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const hit=new Array(n).fill(false);let i=0,j=0;
  while(i<n&&j<m){if(a[i]===b[j]){hit[i]=true;i++;j++}else if(dp[i+1][j]>=dp[i][j+1])i++;else j++}
  return hit;
}
function check(){
  const v=S.verses.find(x=>x.id===Q.id);let ok,total,pct;
  if(Q.level==='recite'){
    const words=v.text.split(/\s+/).filter(w=>norm(w));
    const a=words.map(norm),b=$('#reciteBox').value.split(/\s+/).map(norm).filter(Boolean);
    const hit=lcsMask(a,b);ok=hit.filter(Boolean).length;total=a.length;pct=Math.round(ok*100/total);
    $('#diff').innerHTML=`<p class="peek diff">${words.map((w,i)=>hit[i]?esc(w):`<span class="miss">${esc(w)}</span>`).join(' ')}</p><p class="hint">Underlined words were missed or out of order.</p>`;
  }else{
    const inputs=[...document.querySelectorAll('.blank input')];ok=0;total=inputs.length;
    inputs.forEach(inp=>{const ans=Q.tokens[+inp.dataset.i].w,good=norm(inp.value)===norm(ans),w=inp.parentElement;
      w.classList.toggle('ok',good);w.classList.toggle('bad',!good);w.querySelector('.fix').textContent=good?'':ans;if(good)ok++});
    pct=Math.round(ok*100/total);
  }
  const before=v.mastery||0;
  v.best=v.best||{};v.best[Q.level]=Math.max(v.best[Q.level]||0,pct);
  const pass=Q.level==='recite'?pct>=95:pct===100;
  const reach={easy:1,medium:2,hard:3,recite:3}[Q.level];
  if(pass)v.mastery=Math.max(before,reach);
  v.last=today();markDay();save();
  const order=['easy','medium','hard','recite'];const nextL=order[order.indexOf(Q.level)+1];
  let msg;
  if(pass&&v.mastery>=3&&before<3)msg=`${ok} of ${total} — memorized! This verse is hid in your heart.`;
  else if(pass)msg=`${ok} of ${total} correct. ${nextL?'Try '+LEVELS[nextL].label+' next.':'Great work.'}`;
  else msg=`${ok} of ${total} correct (${pct}%). Read it through once more, then tap New blanks.`;
  $('#qResult').innerHTML=`<div class="result ${pass?'good':'try'}">${esc(msg)}</div>`;
  const s=streak();$('#streak').innerHTML=`<b>${s}</b><span>day streak</span>`;
}

/* ---------- sword drill ---------- */
let D=null,dTimer=null;
const drillPool=()=>S.verses.filter(v=>v.mastery>=3);
function stopTimer(){if(dTimer){clearInterval(dTimer);dTimer=null}}
function openDrill(){D={mode:'ref',cur:null,shown:false,start:0,secs:0,got:0,miss:0,last:null};renderDrill()}
function renderDrill(){
  const pool=drillPool(),v=D.cur?S.verses.find(x=>x.id===D.cur):null;
  let box;
  if(!pool.length)box=`<div class="drillbox empty"><h3>No memorized verses yet</h3><p class="hint">The Memory Drill only uses verses you have memorized. Score 100% on Hard, or 95% on Recite, and the verse joins the drill.</p></div>`;
  else if(!v)box=`<div class="drillbox"><p class="hint">Press Go to draw a verse from your ${pool.length} memorized verse${pool.length===1?'':'s'}.</p></div>`;
  else{
    const prompt=D.mode==='ref'?`<div class="eyebrow">Say this verse</div><div class="drillref">${esc(v.ref)}</div>`:`<div class="eyebrow">Name the reference</div><p class="verse">${esc(v.text)}</p>`;
    const ans=D.mode==='ref'?`<p class="verse">${esc(v.text)}</p>`:`<div class="drillref">${esc(v.ref)}</div>`;
    box=`<div class="drillbox">${prompt}<div class="timer" id="dTime">${D.shown?D.secs.toFixed(1):'0.0'}s</div>${D.shown?`<div class="answer"><div class="eyebrow">Answer · ${esc(v.version)}</div>${ans}</div>`:''}</div>`;
  }
  const total=D.got+D.miss;
  openSheet(`<div class="row between"><div><div class="eyebrow">Memorized verses only</div><h2>Memory Drill</h2></div><button class="btn ghost" data-act="close">Done</button></div>
    <div class="seg two-seg" role="group" aria-label="Drill type"><button data-act="drill-mode" data-id="ref" aria-pressed="${D.mode==='ref'}">Say the verse</button><button data-act="drill-mode" data-id="text" aria-pressed="${D.mode==='text'}">Name the reference</button></div>
    ${box}
    ${pool.length?(v&&!D.shown?`<button class="btn primary go" data-act="drill-reveal">Reveal answer</button>`:v&&D.shown?`<div class="row" style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button class="btn go ok-btn" data-act="drill-mark" data-id="got">Got it</button><button class="btn go" data-act="drill-mark" data-id="miss">Missed it</button></div>`:`<button class="btn primary go" data-act="drill-go">Go</button>`):''}
    ${total?`<p class="hint" style="text-align:center">This round: <b>${D.got}</b> of ${total} correct</p>`:''}`,true);
  if(v&&!D.shown){stopTimer();dTimer=setInterval(()=>{const el=$('#dTime');if(el)el.textContent=((Date.now()-D.start)/1000).toFixed(1)+'s'},100)}
}
function drillGo(){
  const pool=drillPool();if(!pool.length)return;
  let opts=pool.filter(v=>v.id!==D.last);if(!opts.length)opts=pool;
  const v=opts[Math.floor(Math.random()*opts.length)];
  D.cur=v.id;D.last=v.id;D.shown=false;D.start=Date.now();renderDrill();
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id;
  if(a==='tab'){S.tab=id;stopConfirm=null;save();render();scrollTo(0,0)}
  else if(a==='filter'){filter=id;render()}
  else if(a==='practice')openQuiz(id);
  else if(a==='practice-ref'){const v=ensureVerse(id);openQuiz(v.id)}
  else if(a==='edit')openEdit(id);
  else if(a==='close')closeSheet();
  else if(a==='save-verse')saveVerse();
  else if(a==='del'){if(!E.delAsk){E.delAsk=true;b.textContent='Tap again to delete';return}S.verses=S.verses.filter(v=>v.id!==E.id);save();closeSheet();toast('Verse deleted')}
  else if(a==='lib-add'){ensureVerse(id);render();toast('Added to My verses')}
  else if(a==='ch-start'){const c=CHALLENGES.find(x=>x.id===id);S.challenges[id]={start:today()};c.refs.forEach(ensureVerse);save();render();toast(c.name+' started')}
  else if(a==='ch-stop-ask'){stopConfirm=id;render()}
  else if(a==='ch-stop-cancel'){stopConfirm=null;render()}
  else if(a==='ch-stop'){delete S.challenges[id];stopConfirm=null;save();render();toast('Challenge stopped. Your verses stay in your list.')}
  else if(a==='ch-stop-clear'){const c=CHALLENGES.find(x=>x.id===id);delete S.challenges[id];stopConfirm=null;
    const keep=new Set(CHALLENGES.filter(x=>S.challenges[x.id]).flatMap(x=>x.refs).map(refKey)),mine=new Set(c.refs.map(refKey));
    const before=S.verses.length;S.verses=S.verses.filter(v=>!(mine.has(refKey(v.ref))&&!keep.has(refKey(v.ref))&&(v.mastery||0)<3));
    const n=before-S.verses.length;save();render();toast(`Challenge stopped. ${n} verse${n===1?'':'s'} removed.`)}
  else if(a==='reset-ask'){resetAsk=true;render()}
  else if(a==='reset-cancel'){resetAsk=false;render()}
  else if(a==='reset-do'){resetAsk=false;S.verses=[];S.challenges={};S.days=[];save();render();toast('All cleared. Your list is empty.')}
  else if(a==='level'){Q.level=id;newRound()}
  else if(a==='reshuffle')newRound();
  else if(a==='toggle-bank'){Q.bank=!Q.bank;renderQuiz()}
  else if(a==='peek'){Q.peek=!Q.peek;const keep=[...document.querySelectorAll('.blank input')].map(i=>i.value);const rt=$('#reciteBox')?.value;renderQuiz();document.querySelectorAll('.blank input').forEach((i,k)=>i.value=keep[k]||'');if(rt!=null)$('#reciteBox').value=rt}
  else if(a==='bank')fillFromBank(+id,b);
  else if(a==='check')check();
  else if(a==='ics')downloadIcs();
  else if(a==='drill-open')openDrill();
  else if(a==='sd-go'){if(SD.running)return;if(!SD.armed){SD.armed=true;sdPaint()}else{SD.armed=false;sdGo()}}
  else if(a==='sd-show'){SD.shown=true;sdPaint()}
  else if(a==='sd-add'){const v=SD.v;S.verses.unshift(mkVerse(`${v.book} ${v.chapter}:${v.verse}`,v.text,'KJV','builtin'));save();sdPaint();toast('Added to My Verses')}
  else if(a==='drill-mode'){D.mode=id;D.cur=null;D.shown=false;stopTimer();renderDrill()}
  else if(a==='drill-go')drillGo();
  else if(a==='drill-reveal'){D.secs=(Date.now()-D.start)/1000;D.shown=true;stopTimer();renderDrill()}
  else if(a==='drill-mark'){id==='got'?D.got++:D.miss++;markDay();save();drillGo()}
  else if(a==='copy-songs'){const txt=SONGS.map((s,i)=>`${i+1}. ${s.title} — ${s.artist} (${s.ref})`).join('\n');try{navigator.clipboard.writeText(txt).then(()=>toast('Song list copied'),()=>toast('Couldn’t copy here. Long-press the list to select it.'))}catch(err){toast('Couldn’t copy here. Long-press the list to select it.')}}
});
$('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});
render();
</script>
